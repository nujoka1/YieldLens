[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yieldlens-nigeria"
version = "0.1.0"
description = "Big-data foundation for Nigerian bean and cowpea yield intelligence"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=yieldlens --cov-report=term-missing"
testpaths = ["tests"]
markers = ["integration: real Docker infrastructure checks (opt in)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
